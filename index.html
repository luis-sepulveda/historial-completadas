      const html = new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
    } catch(e){ console.error('sobre:', e && (e.name + ' ' + e.message)); msg('🔒 No se pudo abrir', 'Tu clave guardada no abre esta página. Entra de nuevo al Módulo de Actividades con tu clave.', true); }
  }
  /* interruptor de emergencia: si esta apagado, borra la llave y no abre nada */
  fetch('https://raw.githubusercontent.com/luis-sepulveda/Rutas-tecnicos/main/estado.json?t=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
    .then(function(j){ if(j && j.activo === false){ borrar(); msg('⛔ Página apagada', 'Esta página está desactivada por el administrador.', false); return; } abrir(); });
})();
</script></body></html>
