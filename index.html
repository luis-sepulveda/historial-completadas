<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de gestión por técnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     COLORES DEL TABLERO
     Todo el color sale de aca. Si quieres cambiar un tono, lo
     cambias en esta lista y se actualiza en toda la pagina.

     Para volver al tema oscuro de antes: arriba del todo, en la
     linea 2, cambia   <html lang="es">   por   <html lang="es" class="oscuro">
     ============================================================ */
  :root{
    /* ---------- TEMA CLARO (el que se ve ahora) ---------- */
    --bg:#f1f5f9;          /* fondo de la pagina */
    --panel:#ffffff;       /* tarjetas y filas */
    --panel2:#e9eff5;      /* cabeceras de tabla, chips apagados */
    --zebra:#f7fafc;       /* filas pares, para no perder el renglon */
    --line:#d3dde6;        /* lineas y bordes */
    --ink:#16232f;         /* texto principal */
    --muted:#5f7386;       /* texto secundario */

    --teal:#0f766e;        /* completadas / totales */
    --amber:#b45309;       /* efectividad / OT */
    --violet:#6d28d9;      /* altas / GSA */
    --rose:#be123c;        /* no realizadas */

    /* texto que va ENCIMA de un chip encendido */
    --sobre-teal:#ffffff; --sobre-rose:#ffffff; --sobre-amber:#ffffff;

    --hover:#e4eef7;       /* fila bajo el mouse */
    --cero:#a9b8c6;        /* los puntitos de las casillas en cero */
    --borde-hover:#9aadbf;
    --lavado-rose:#fdecef; /* fondo suave de la efectividad baja */
    --sombra:rgba(20,45,70,.11);
    --velo:rgba(16,28,40,.45);
    --relieve:0 1px 2px rgba(20,45,70,.06);
    --esquema:light;
  }

  html.oscuro{
    /* ---------- TEMA OSCURO (el original, apagado) ---------- */
    --bg:#0b0f14; --panel:#131a22; --panel2:#0f151c; --zebra:#111922;
    --line:#22303c; --ink:#e7eef5; --muted:#8aa0b2;
    --teal:#2dd4bf; --amber:#fbbf24; --violet:#a78bfa; --rose:#fb7185;
    --sobre-teal:#06231f; --sobre-rose:#2c0910; --sobre-amber:#2b1e02;
    --hover:#18212b; --cero:#3d4d5c; --borde-hover:#2f4152;
    --lavado-rose:rgba(251,113,133,.10);
    --sombra:rgba(0,0,0,.28); --velo:rgba(4,8,12,.72);
    --relieve:none; --esquema:dark;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:Inter,system-ui,sans-serif;padding:22px 18px 60px;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:min(1560px,97vw);margin:0 auto}
  h1{font-family:'Space Grotesk',sans-serif;font-size:23px;margin:0 0 4px;letter-spacing:-.4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .sub b{color:var(--ink);font-weight:600}

  .filtros{display:flex;flex-wrap:wrap;gap:22px;background:var(--panel);
           border:1px solid var(--line);border-radius:12px;padding:14px 16px;
           margin-bottom:16px;box-shadow:var(--relieve)}
  .grupo{display:flex;flex-direction:column;gap:7px}
  .grupo>label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
        padding:6px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;
        font-family:inherit;transition:.15s}
  .chip:hover{color:var(--ink);border-color:var(--borde-hover)}
  .chip.on{background:var(--teal);border-color:var(--teal);color:var(--sobre-teal);font-weight:600}
  .chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  /* el chip de no realizadas se prende en rojo, para no confundirse de vista */
  .chip.nr.on{background:var(--rose);border-color:var(--rose);color:var(--sobre-rose)}
  .chip.mix.on{background:var(--amber);border-color:var(--amber);color:var(--sobre-amber)}
  .cuenta{font-size:10.5px;opacity:.8;margin-left:5px}

  /* buscador de tecnico */
  .buscador{background:var(--panel);border:1px solid var(--line);color:var(--ink);
            padding:6px 13px;border-radius:999px;font-size:12.5px;font-family:inherit;
            min-width:230px;transition:.15s}
  .buscador::placeholder{color:var(--muted)}
  .buscador:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.14)}
  .buscador.activo{border-color:var(--teal);color:var(--teal);font-weight:500}
  #ftec-x{display:none}
  #ftec-x.ver{display:inline-block}

  /* selector de dia */
  .selector{background:var(--panel);border:1px solid var(--line);color:var(--ink);
            padding:6px 12px;border-radius:999px;font-size:12.5px;font-family:inherit;
            color-scheme:var(--esquema);cursor:pointer;transition:.15s}
  .selector:focus{outline:none;border-color:var(--teal)}
  .selector.activo{border-color:var(--teal);color:var(--teal);font-weight:600}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  /* la barrita de color a la izquierda reemplaza al fondo oscuro:
     se distingue de un vistazo sin ensuciar la tarjeta */
  .kpi{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
       border-radius:12px;padding:13px 15px;box-shadow:var(--relieve)}
  .kpi .n{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:700;line-height:1.1}
  .kpi .l{font-size:11px;color:var(--muted);margin-top:3px}
  .kpi.t .n{color:var(--teal)}   .kpi.t{border-left-color:var(--teal)}
  .kpi.a .n{color:var(--amber)}  .kpi.a{border-left-color:var(--amber)}
  .kpi.v .n{color:var(--violet)} .kpi.v{border-left-color:var(--violet)}
  .kpi.r .n{color:var(--rose)}   .kpi.r{border-left-color:var(--rose)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        overflow:hidden;box-shadow:var(--relieve)}
  .card h2{font-family:'Space Grotesk',sans-serif;font-size:14px;margin:0;
           padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 11px;text-align:center;white-space:nowrap}
  th{background:var(--panel2);color:var(--muted);font-size:10px;letter-spacing:.7px;
     text-transform:uppercase;font-weight:700;position:sticky;top:0;cursor:pointer;user-select:none}
  th:hover{color:var(--ink)}
  th.izq,td.izq{text-align:left}
  tbody tr{border-top:1px solid var(--line);cursor:pointer}
  /* franjas suaves: en una tabla tan ancha ayudan a no saltarse de fila */
  tbody tr:nth-child(even){background:var(--zebra)}
  tbody tr:hover{background:var(--hover)}
  td.tec{font-weight:600}
  td.cero{color:var(--cero)}
  td.tot{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--teal)}
  td.nr{font-family:'JetBrains Mono',monospace;color:var(--rose);font-weight:500}
  td.ef{font-family:'JetBrains Mono',monospace;color:var(--amber);font-weight:500}
  /* La columna de % efectividad se saco el 05-09-2026. Estos estilos quedan
     aqui sin uso, por si vuelve. */
  td.ef.bajo{color:var(--rose);font-weight:700}
  th.sep,td.sep{border-left:1px solid var(--line)}

  /* La columna del tecnico queda clavada a la izquierda: cuando corres la
     tabla para ver el desglose, sigues sabiendo de quien es cada fila. */
  th.tecc,td.tecc{position:sticky;left:0;min-width:186px;background:var(--panel)}
  td.tecc{z-index:2}
  th.tecc{z-index:4;background:var(--panel2)}
  tbody tr:nth-child(even) td.tecc{background:var(--zebra)}
  tfoot td.tecc{background:var(--panel2)}
  tbody tr:hover td.tecc{background:var(--hover)}
  /* sombrita al borde de la columna fija, para que se note que hay mas */
  th.tecc::after,td.tecc::after{content:'';position:absolute;top:0;right:0;
    width:9px;height:100%;transform:translateX(100%);pointer-events:none;
    background:linear-gradient(90deg,var(--sombra),transparent)}
  .sup{font-size:10.5px;color:var(--muted);display:block;font-weight:400;margin-top:1px}
  tfoot td{border-top:2px solid var(--line);background:var(--panel2);font-weight:700}

  .vacio{padding:34px;text-align:center;color:var(--muted);font-size:13px}

  dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);
         border-radius:14px;padding:0;max-width:900px;width:94vw;max-height:82vh;
         box-shadow:0 18px 44px rgba(16,28,40,.20)}
  dialog::backdrop{background:var(--velo)}
  .dlg-h{display:flex;justify-content:space-between;align-items:center;gap:14px;
         padding:14px 17px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .dlg-h h3{font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0;font-weight:600}
  .dlg-h button{background:var(--panel);border:1px solid var(--line);color:var(--muted);
                border-radius:8px;padding:5px 12px;cursor:pointer;font-family:inherit;font-size:12px}
  .dlg-h button:hover{color:var(--ink);border-color:var(--borde-hover)}
  .dlg-b{overflow:auto;max-height:66vh}
  .dlg-b table{font-size:12.5px}
  .dlg-b td{white-space:normal}
  .dlg-b td:first-child,.dlg-b td.ot{white-space:nowrap}
  .dlg-b tbody tr{cursor:default}
  .ot{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--amber);font-weight:500}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
        background:var(--panel2);border:1px solid var(--line)}
  .pill.gsa{border-color:var(--violet);color:var(--violet);font-weight:600}
  .pill.ok{border-color:var(--teal);color:var(--teal);font-weight:600}
  .pill.no{border-color:var(--rose);color:var(--rose);font-weight:600}
  .pill.area{border-color:var(--borde-hover);color:var(--muted);font-size:10.5px}

  @media (max-width:640px){
    body{padding:14px 11px 50px} h1{font-size:19px}
    .filtros{gap:14px;padding:12px} th,td{padding:7px 8px;font-size:12px}
    .buscador{min-width:0;width:100%}
    th.tecc,td.tecc{min-width:132px}
    .kpi{padding:11px 13px} .kpi .n{font-size:23px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* si algun supervisor lo manda a imprimir, que salga en blanco y legible */
  @media print{
    body{background:#fff;padding:0}
    .filtros,.kpis{box-shadow:none}
    .card{box-shadow:none;border-color:#bbb}
    tbody tr{page-break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Historial de gestión por técnico</h1>
  <div class="sub"><b id="periodo">—</b> · Técnicos DOMI · actualizado <b id="gen">—</b></div>

  <div class="filtros">
    <div class="grupo">
      <label>Resultado</label>
      <div class="chips" id="fres">
        <button class="chip on" data-r="comp">Completadas <span class="cuenta" id="c-comp"></span></button>
        <button class="chip nr" data-r="nore">No realizadas <span class="cuenta" id="c-nore"></span></button>
        <button class="chip mix" data-r="todo">Todas <span class="cuenta" id="c-todo"></span></button>
      </div>
    </div>
    <div class="grupo">
      <label>Supervisor</label>
      <div class="chips" id="fsup"></div>
    </div>
    <div class="grupo">
      <label>Mes</label>
      <div class="chips">
        <select class="selector" id="fmes" aria-label="Mes"></select>
      </div>
    </div>
    <div class="grupo">
      <label>Día</label>
      <div class="chips">
        <select class="selector" id="fdia" aria-label="Día"></select>
      </div>
    </div>
    <div class="grupo">
      <label>Técnico</label>
      <div class="chips">
        <input class="buscador" id="ftec" list="ltec" autocomplete="off"
               placeholder="Escribe o elige un técnico">
        <datalist id="ltec"></datalist>
        <button class="chip" id="ftec-x">Limpiar</button>
      </div>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2 id="tit-tabla">Detalle por técnico — toca una fila para ver sus órdenes</h2>
    <div class="scroll"><table id="tabla"></table></div>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-h">
    <h3 id="dlg-t">—</h3>
    <button id="dlg-x">Cerrar</button>
  </div>
  <div class="dlg-b"><table id="dlg-tb"></table></div>
</dialog>

document.getElementById('gen').textContent = D.generado;
document.getElementById('periodo').textContent = D.periodo || '';

let supActivo = 'TODOS';
let tecFiltro = '';
let diaSel = '';
let mesSel = '';               // '2026-07' = solo julio 2026
let resActivo = 'comp';        // comp | nore | todo

// ---------- filtro de resultado ----------
// Ojo: este filtro NO entra en 'base'. La base es todo lo que gestiono el
// tecnico en el periodo, y de ahi salen las cuentas de completadas, no
// realizadas y efectividad. Si el resultado entrara en la base, el % se
// calcularia sobre si mismo y siempre daria 100.
document.getElementById('fres').addEventListener('click', e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  resActivo=b.dataset.r; activar(document.getElementById('fres'),'r',resActivo);
  refrescarMeses(); refrescarDias(); pintar();
});

// ---------- filtros de supervisor ----------
const fsup = document.getElementById('fsup');
[['TODOS','Todos']].concat(D.supervisores.map(s=>[s,s])).forEach(([v,t],i)=>{
  const b=document.createElement('button');
  b.className='chip'+(i===0?' on':''); b.dataset.s=v; b.textContent=t;
  fsup.appendChild(b);
});

function activar(cont, attr, valor){
  cont.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset[attr]===valor));
}
fsup.addEventListener('click', e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  supActivo=b.dataset.s; activar(fsup,'s',supActivo);
  refrescarLista(); refrescarMeses(); refrescarDias(); pintar();
});

// ---------- selector de mes ----------
// Se arma solo con los meses que existen en el historico. En agosto vas a
// ver 'agosto 2026' y 'julio 2026'; en septiembre se suma solo, sin tocar
// nada. Elegir un mes manda sobre los chips de periodo y ademas deja el
// selector de dia mostrando SOLO los dias de ese mes.
const selMes = document.getElementById('fmes');

const MESES = ['enero','febrero','marzo','abril','mayo','junio',
               'julio','agosto','septiembre','octubre','noviembre','diciembre'];

function bonitoMes(ym){
  const p = ym.split('-');
  return MESES[Number(p[1]) - 1] + ' ' + p[0];
}

function refrescarMeses(){
  let base = D.ordenes.filter(o=>{
    if(supActivo!=='TODOS' && o.supervisor!==supActivo) return false;
    if(tecFiltro && !String(o.tecnico).toUpperCase().includes(tecFiltro)) return false;
    return !!o.fecha;
  });
  base = porResultado(base, resActivo);

  const conteo = {};
  base.forEach(o=>{ const m=o.fecha.slice(0,7); conteo[m]=(conteo[m]||0)+1; });
  const meses = Object.keys(conteo).sort().reverse();   // el mas reciente arriba

  selMes.innerHTML =
    `<option value="">Todos los meses (${base.length} OT)</option>` +
    meses.map(m=>`<option value="${m}">${bonitoMes(m)} · ${conteo[m]} OT</option>`).join('');

  // si el mes elegido ya no tiene nada con estos filtros, vuelvo a "todos"
  if(mesSel && !conteo[mesSel]){
    mesSel = '';
  }
  selMes.value = mesSel;
  selMes.classList.toggle('activo', !!mesSel);
}

selMes.addEventListener('change', ()=>{
  mesSel = selMes.value;
  selMes.classList.toggle('activo', !!mesSel);
  diaSel = '';                                   // cambiar de mes limpia el dia
  refrescarDias();
  pintar();
});

// ---------- selector de dia ----------
const selDia = document.getElementById('fdia');

function bonita(iso){
  const p = iso.split('-');
  return p[2]+'-'+p[1]+'-'+p[0];
}

// Solo ofrece dias que TIENEN ordenes, con el conteo al lado. Respeta el
// supervisor, el tecnico y tambien el boton de resultado: si estas mirando
// no realizadas, el conteo del dia es de no realizadas.
function refrescarDias(){
  let base = D.ordenes.filter(o=>{
    if(supActivo!=='TODOS' && o.supervisor!==supActivo) return false;
    if(tecFiltro && !String(o.tecnico).toUpperCase().includes(tecFiltro)) return false;
    if(mesSel && o.fecha.slice(0,7)!==mesSel) return false;   // solo el mes elegido
    return !!o.fecha;
  });
  base = porResultado(base, resActivo);

  const conteo = {};
  base.forEach(o=>{ conteo[o.fecha] = (conteo[o.fecha]||0) + 1; });
  const dias = Object.keys(conteo).sort().reverse();   // el mas reciente arriba

  const etiquetaTodos = mesSel
    ? `Todos los días de ${bonitoMes(mesSel)} (${base.length} OT)`
    : `Todos los días (${base.length} OT)`;

  selDia.innerHTML =
    `<option value="">${etiquetaTodos}</option>` +
    dias.map(d=>`<option value="${d}">${bonita(d)} · ${conteo[d]} OT</option>`).join('');

  // si el dia elegido ya no existe con estos filtros, vuelvo a "todos"
  if(diaSel && !conteo[diaSel]){
    diaSel = '';
  }
  selDia.value = diaSel;
  selDia.classList.toggle('activo', !!diaSel);
}

selDia.addEventListener('change', ()=>{
  diaSel = selDia.value;
  selDia.classList.toggle('activo', !!diaSel);
  pintar();
});

// ---------- filtro de tecnico ----------
const inpTec = document.getElementById('ftec');
const btnTecX = document.getElementById('ftec-x');

// Lista de sugerencias: solo los tecnicos del supervisor elegido
function refrescarLista(){
  const nombres = new Set(
    D.ordenes.filter(o => supActivo==='TODOS' || o.supervisor===supActivo)
             .map(o => o.tecnico)
  );
  document.getElementById('ltec').innerHTML =
    [...nombres].sort().map(t=>`<option value="${t}"></option>`).join('');
}

function aplicarTec(){
  tecFiltro = inpTec.value.trim().toUpperCase();
  inpTec.classList.toggle('activo', !!tecFiltro);
  btnTecX.classList.toggle('ver', !!tecFiltro);
  refrescarMeses();
  refrescarDias();
  pintar();
}
inpTec.addEventListener('input', aplicarTec);
btnTecX.addEventListener('click', ()=>{ inpTec.value=''; aplicarTec(); });

// ---------- filtrado ----------
// Todo lo gestionado con los filtros puestos, sin mirar el resultado.
// Los botones de periodo (Hoy / 7 dias / Este mes) se sacaron el 06-09-2026:
// ahora el recorte de fechas lo mandan los selectores de Mes y Dia. Si no
// eliges ninguno, se muestra todo el historico.
function base(){
  return D.ordenes.filter(o=>{
    if(supActivo!=='TODOS' && o.supervisor!==supActivo) return false;
    if(tecFiltro && !String(o.tecnico).toUpperCase().includes(tecFiltro)) return false;
    if(diaSel) return o.fecha===diaSel;
    if(mesSel) return o.fecha.slice(0,7)===mesSel;
    return true;
  });
}

// o.r  ->  1 = completada, 0 = no realizada
function porResultado(ords, modo){
  if(modo==='comp') return ords.filter(o=>o.r===1);
  if(modo==='nore') return ords.filter(o=>o.r===0);
  return ords;
}

// ---------- tabla ----------
let ordenCol='TOTAL', ordenDesc=true;

function pintar(){
  const todo = base();                       // todo lo gestionado
  const ords = porResultado(todo, resActivo); // lo que se ve en la tabla
  const cols = D.columnas;

  const nComp = todo.filter(o=>o.r===1).length;
  const nNore = todo.length - nComp;

  // contador arriba de cada boton
  document.getElementById('c-comp').textContent = nComp;
  document.getElementById('c-nore').textContent = nNore;
  document.getElementById('c-todo').textContent = todo.length;

  // Las cuentas por tecnico se arman sobre la base, no sobre lo visible,
  // para que la efectividad sea la real aunque estes mirando una sola vista.
  const porTec={};
  function fila(o){
    if(!porTec[o.tecnico]) porTec[o.tecnico]=
      {tec:o.tecnico,sup:o.supervisor,TOTAL:0,CC:0,NC:0,EF:0,items:[]};
    return porTec[o.tecnico];
  }
  todo.forEach(o=>{ const f=fila(o); if(o.r===1) f.CC++; else f.NC++; });
  ords.forEach(o=>{
    const f=fila(o);
    f[o.categoria]=(f[o.categoria]||0)+1; f.TOTAL++; f.items.push(o);
  });

  // fuera los tecnicos que no tienen nada que mostrar en esta vista
  let filas=Object.values(porTec).filter(f=>f.TOTAL>0);
  // La efectividad se sigue calculando pero ya no se muestra en ninguna parte.
  // Si algun dia la quieres de vuelta, este numero (f.EF) ya esta listo.
  filas.forEach(f=>{
    const g=f.CC+f.NC;
    f.EF = g ? Math.round(1000*f.CC/g)/10 : 0;
  });

  filas.sort((a,b)=>{
    if(ordenCol==='tec') return ordenDesc? b.tec.localeCompare(a.tec) : a.tec.localeCompare(b.tec);
    const x=(a[ordenCol]||0), y=(b[ordenCol]||0);
    return ordenDesc? y-x || a.tec.localeCompare(b.tec) : x-y || a.tec.localeCompare(b.tec);
  });

  // ---------- KPIs ----------
  let k = kpi('t',nComp,'completadas')+
          kpi('r',nNore,'no realizadas');

  if(resActivo==='nore'){
    // en no realizadas lo que importa no es el tipo de OT, es el motivo
    const motivos={};
    ords.forEach(o=>{ const m=o.codigo_cierre||'Sin código'; motivos[m]=(motivos[m]||0)+1; });
    Object.entries(motivos).sort((a,b)=>b[1]-a[1]).slice(0,3)
      .forEach(([m,n])=> k += kpi('v',n,m));
  } else {
    const rep=ords.filter(o=>o.categoria==='Reparación').length;
    const alt=ords.filter(o=>o.categoria.startsWith('Alta')).length;
    const mig=ords.filter(o=>o.categoria.startsWith('Migración')).length;
    k += kpi('a',rep,'reparaciones')+kpi('v',alt,'altas')+kpi('r',mig,'migraciones');
  }
  k += kpi('t',filas.length,'técnicos en la vista');
  document.getElementById('kpis').innerHTML = k;

  // ---------- titulo de la tabla ----------
  const titulos={
    comp:'Completadas por técnico',
    nore:'No realizadas por técnico',
    todo:'Toda la gestión por técnico'
  };
  document.getElementById('tit-tabla').textContent =
    titulos[resActivo]+' — toca una fila para ver sus órdenes';

  const tabla=document.getElementById('tabla');
  if(!filas.length){
    let msg = 'No hay órdenes registradas para este filtro. Prueba con otro período.';
    if(resActivo==='nore' && nComp){
      msg = 'Ninguna no realizada con estos filtros. Todo salió completado.';
    } else if(tecFiltro){
      msg = 'Ningún técnico coincide con «'+inpTec.value.trim()+'» en este período. Borra el nombre o cambia el filtro.';
    } else if(diaSel){
      msg = 'No hay órdenes el '+bonita(diaSel)+' con estos filtros.';
    } else if(mesSel){
      msg = 'No hay órdenes en '+bonitoMes(mesSel)+' con estos filtros.';
    }
    tabla.innerHTML='<tbody><tr><td class="vacio">'+msg+'</td></tr></tbody>';
    return;
  }

  // En completadas y en todas se muestran ademas las no realizadas y el %,
  // asi ves el contexto sin tener que cambiar de vista.
  const conExtra = resActivo!=='nore';

  // Los numeros que se miran primero (total, no realizadas, efectividad) van
  // pegados al nombre. El desglose por categoria queda a la derecha: si no
  // cabe en pantalla se corre con el scroll, pero lo importante siempre esta.
  let h='<thead><tr><th class="izq tecc" data-c="tec">Técnico</th>';
  h+='<th data-c="TOTAL">Total</th>';
  if(conExtra){
    if(resActivo==='todo') h+='<th data-c="CC">Compl.</th>';
    h+='<th data-c="NC">No real.</th>';
  }
  cols.forEach((c,i)=>h+=`<th${i?'':' class="sep"'} data-c="${c}">${c}</th>`);
  h+='</tr></thead><tbody>';

  filas.forEach(f=>{
    h+=`<tr data-tec="${f.tec}"><td class="izq tec tecc">${f.tec}<span class="sup">${f.sup}</span></td>`;
    h+=`<td class="tot">${f.TOTAL}</td>`;
    if(conExtra){
      if(resActivo==='todo') h+=`<td class="tot">${f.CC}</td>`;
      h+=`<td class="${f.NC?'nr':'cero'}">${f.NC||'·'}</td>`;
    }
    cols.forEach((c,i)=>{
      const n=f[c]||0;
      h+=`<td class="${i?'':'sep '}${n?'':'cero'}">${n||'·'}</td>`;
    });
    h+='</tr>';
  });

  // fila de totales
  h+='</tbody><tfoot><tr><td class="izq tecc">TOTAL</td>';
  h+=`<td class="tot">${ords.length}</td>`;
  if(conExtra){
    if(resActivo==='todo') h+=`<td class="tot">${nComp}</td>`;
    h+=`<td class="${nNore?'nr':'cero'}">${nNore||'·'}</td>`;
  }
  cols.forEach((c,i)=>{
    const s=filas.reduce((a,f)=>a+(f[c]||0),0);
    h+=`<td class="${i?'':'sep '}${s?'':'cero'}">${s||'·'}</td>`;
  });
  h+='</tr></tfoot>';
  tabla.innerHTML=h;

  tabla.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
    const c=th.dataset.c;
    if(ordenCol===c){ordenDesc=!ordenDesc;} else {ordenCol=c;ordenDesc=(c!=='tec');}
    pintar();
  }));
  tabla.querySelectorAll('tbody tr').forEach(tr=>tr.addEventListener('click',()=>{
    abrirDetalle(porTec[tr.dataset.tec]);
  }));
}

function kpi(cls,n,l){
  return `<div class="kpi ${cls}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
}

// ---------- detalle ----------
const dlg=document.getElementById('dlg');
document.getElementById('dlg-x').addEventListener('click',()=>dlg.close());

function abrirDetalle(f){
  const resumen = f.NC
    ? f.CC+' completadas · '+f.NC+' no realizadas'
    : f.TOTAL+' órdenes';
  document.getElementById('dlg-t').textContent = f.tec+' · '+resumen+' · '+f.sup;

  const items=f.items.slice().sort((a,b)=> b.fecha.localeCompare(a.fecha));
  let h='<thead><tr><th class="izq">Fecha</th><th class="izq">OT</th>'+
        '<th class="izq">Resultado</th><th class="izq">Categoría</th>'+
        '<th class="izq">Subtipo</th><th class="izq">Cierre</th>'+
        '<th class="izq">Ciudad</th></tr></thead><tbody>';
  items.forEach(o=>{
    // la GSA es no realizada en el portal pero cuenta como completada
    const gsa = o.r===1 && /aprovisionamiento/i.test(o.codigo_cierre||'');
    const res = gsa ? '<span class="pill gsa">Completada · GSA</span>'
              : o.r===1 ? '<span class="pill ok">Completada</span>'
                        : '<span class="pill no">No realizada</span>';
    const area = (o.r===0 && o.area) ? ` <span class="pill area">${o.area}</span>` : '';
    h+=`<tr><td class="izq">${o.fecha}</td><td class="izq ot">${o.ot}</td>`+
       `<td class="izq">${res}</td>`+
       `<td class="izq"><span class="pill">${o.categoria}</span></td>`+
       `<td class="izq">${o.subtipo||'—'}</td>`+
       `<td class="izq">${o.codigo_cierre||'—'}${area}</td>`+
       `<td class="izq">${o.ciudad||'—'}</td></tr>`;
  });
  document.getElementById('dlg-tb').innerHTML=h+'</tbody>';
  dlg.showModal();
}

refrescarLista();
refrescarMeses();
refrescarDias();
pintar();
</script>
